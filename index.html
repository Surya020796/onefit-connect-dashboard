.fig{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.fig .cap{padding:10px 14px;font-weight:700;color:var(--navy);font-size:14px;border-bottom:1px solid var(--rule)}.fig .cap span{font-weight:400;color:var(--muted)}
.fig .body{padding:10px 12px 4px}.fig .box{height:270px}.fig .note{font-size:12px;color:var(--muted);padding:0 14px 12px}
.finding{margin:16px 0 4px;padding:13px 16px;border-left:5px solid var(--blue);background:#EEF4FE;border-radius:10px}.finding b{color:var(--navy)}.finding small{display:block;color:var(--muted);margin-top:3px;font-size:13px}
.mf{display:flex;justify-content:space-between;gap:10px;padding:10px 26px 20px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:var(--blue2)}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--rule);text-transform:none;letter-spacing:0;font-size:15px;margin:0}

@media(max-width:1000px){.ovg,.insg{grid-template-columns:repeat(2,1fr)}.stats,.flow{grid-template-columns:repeat(2,1fr)}.ba{grid-template-columns:1fr}.cards2{grid-template-columns:1fr}.miniK{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.ovg,.insg,.stats,.flow,.trio,.figs{grid-template-columns:1fr}.page{padding:16px 14px 50px}.banner{padding:20px}.miniK{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
(function(){
'use strict';
if(!window.DATA||!window.DATA.before||!window.SESS){var nc=document.getElementById('nochart');nc.style.display='block';nc.textContent='The data files did not load. Refresh the page (Ctrl+Shift+R, or Cmd+Shift+R on Mac) and make sure summary.js and sessions.js were uploaded.';return}
var D=window.DATA,B=D.before,A=D.after,MONTHS=D.months;
var LOCS=['LOC01','LOC02','LOC03'],LL=['Location 1','Location 2','Location 3'],CLS=['Spin','HIIT','Strength','Pilates','Yoga','Zumba'];
var CB='#F2A33A',CA='#2F6FDB',ORG='#E0533D';
if(typeof Chart!=='undefined'){Chart.defaults.color='#5E6E8A';Chart.defaults.font.family='Inter,"Segoe UI",Arial,sans-serif';Chart.defaults.borderColor='#E6ECF5';Chart.defaults.animation={duration:900,easing:'easeOutQuart'}}
/* ---------- session-level data ---------- */
var C={id:0,date:1,loc:2,ins:3,cls:4,cap:5,peak:6,book:7,att:8,den:9,churn:10,err:11,rev:12,cost:13,profit:14,rating:15};
var S={before:window.SESS.before,after:window.SESS.after};
function sum(rows,k){var s=0;rows.forEach(function(r){s+=r[C[k]]});return s}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}

function margin(rows){var r=sum(rows,'rev');return r?sum(rows,'profit')/r*100:0}
function flt(rows,f){return rows.filter(f)}
function month(r){return +r[C.date].slice(5,7)}
function fill(r){return r[C.att]/r[C.cap]*100}
function corr(x,y){var mx=mean(x),my=mean(y),n=x.length,sxy=0,sxx=0,syy=0;for(var i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=Math.pow(x[i]-mx,2);syy+=Math.pow(y[i]-my,2)}return sxy/Math.sqrt(sxx*syy)}

var num=function(v){return Math.round(v).toLocaleString('en-US')};
var usd=function(v){return '$'+Math.round(v).toLocaleString('en-US')};
B.overall.off=B.byPeak['0'].util;A.overall.off=A.byPeak['0'].util;
var KP=[
 {k:'off',name:'Off-peak utilization',better:'up',view:'ch1'},
 {k:'util',name:'Seat utilization rate',better:'up',view:'ch1'},
 {k:'denied',name:'Cross-location requests turned away',better:'down',view:'ch2'},
 {k:'churn',name:'Churn-risk share of attendees',better:'down',view:'ch4'},
 {k:'rating',name:'Average member rating',better:'up',view:'ch6'},
 {k:'margin',name:'Profit margin',better:'up',view:'ch5'}];
function fmt(k,v){return k==='denied'?v.toLocaleString('en-US'):(k==='rating'?v.toFixed(2):v.toFixed(1)+'%')}
function delta(k,b,a,better){var d=a-b,good=(better==='up'?d>0:d<0),p=k==='denied'?Math.round(d/b*100)+'%':(k==='rating'?(d>=0?'+':'')+d.toFixed(2):(d>=0?'+':'')+d.toFixed(1)+' pts');return '<span class="'+(good?'good':'bad')+'">'+(d>0?'&#9650; ':'&#9660; ')+p+'</span>'}
/* derived facts (live from the session tables) */
var bo=flt(S.before,function(r){return r[C.peak]===0}),ao=flt(S.after,function(r){return r[C.peak]===0});
var F={};
F.offLoss=flt(bo,function(r){return r[C.profit]<0}).length/bo.length*100;
F.offLossA=flt(ao,function(r){return r[C.profit]<0}).length/ao.length*100;
var denTot=sum(S.before,'den');F.denEmpty=sum(flt(S.before,function(r){return fill(r)<=75&&r[C.den]>0}),'den')/denTot*100;
F.errRate=LOCS.map(function(l){var q=flt(S.before,function(r){return r[C.loc]===l});return flt(q,function(r){return r[C.err]!=='No Error'}).length/q.length*100});
var withE=flt(S.before,function(r){return r[C.err]!=='No Error'}),noE=flt(S.before,function(r){return r[C.err]==='No Error'});
F.rE=mean(withE.map(function(r){return r[C.rating]}));F.rN=mean(noE.map(function(r){return r[C.rating]}));
F.accB=noE.length/S.before.length*100;F.accA=flt(S.after,function(r){return r[C.err]==='No Error'}).length/S.after.length*100;
function clsStat(rows,c){var q=flt(rows,function(r){return r[C.cls]===c});return{util:util(q),pps:sum(q,'profit')/q.length,margin:margin(q)}}
F.spin=clsStat(S.before,'Spin');F.yoga=clsStat(S.before,'Yoga');

 c.data.datasets.forEach(function(ds,i){var m=c.getDatasetMeta(i);if(m.hidden)return;m.data.forEach(function(el,j){var v=ds.data[j];var f=FM[c.canvas.id];if(v!==null&&v!==undefined)ctx.fillText(f?f(v):v,el.x,el.y-4)})});ctx.restore()}};
var tries={},curTab='overview';

function mk(id,cfg){var el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;
 var par=el.parentNode,w=par.clientWidth,hh=par.clientHeight;
 if(!w||!hh){tries[id]=(tries[id]||0)+1;if(tries[id]<20)setTimeout(function(){mk(id,cfg)},100);return}
 tries[id]=0;
 try{if(charts[id])charts[id].destroy();FM[id]=cfg.options.fmt;delete cfg.options.fmt;cfg.options.plugins=cfg.options.plugins||{};if(cfg.options.vals!==false&&cfg.type==='bar')cfg.options.plugins.valsOn=true;delete cfg.options.vals;
  cfg.options.responsive=false;cfg.options.maintainAspectRatio=false;cfg.options.animation=cfg.options.animation||{duration:900};
  el.width=w;el.height=hh;el.style.width=w+'px';el.style.height=hh+'px';
